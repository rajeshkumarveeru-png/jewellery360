databaseChangeLog:
  # Tables marked with the legacy guard already exist in development databases created before the
  # pre-production schema consolidation; 090-legacy-dev-upgrade.yml converts those. Remove the guards
  # together with 090-legacy-dev-upgrade.yml once every development database has been upgraded.
  - changeSet:
      id: baseline-job-card
      author: jewellery360
      changes:
        - createTable:
            tableName: job_card
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: company_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_job_card_company, references: company(id)}}
              - column: {name: branch_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_job_card_branch, references: branch(id)}}
              - column: {name: karigar_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_job_card_karigar, references: karigar(id)}}
              - column: {name: job_no, type: VARCHAR(80), constraints: {nullable: false}}
              - column: {name: job_date, type: DATE, constraints: {nullable: false}}
              - column: {name: due_date, type: DATE}
              - column: {name: description, type: VARCHAR(1000), constraints: {nullable: false}}
              - column: {name: custom_order_id, type: BIGINT, constraints: {foreignKeyName: fk_job_card_custom_order, references: custom_order(id)}}
              - column: {name: repair_order_id, type: BIGINT, constraints: {foreignKeyName: fk_job_card_repair_order, references: repair_order(id)}}
              - column: {name: purity_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_job_card_purity, references: purity_master(id)}}
              - column: {name: wastage_allowed_percent, type: 'DECIMAL(19,3)', defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: labour_charge, type: 'DECIMAL(19,3)', defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: status, type: VARCHAR(30), defaultValue: OPEN, constraints: {nullable: false}}
              - column: {name: closed_date, type: DATE}
              - column: {name: notes, type: VARCHAR(1000)}
              - column: {name: created_by_id, type: BIGINT, constraints: {foreignKeyName: fk_job_card_created_by, references: app_user(id)}}
              - column: {name: created_at, type: 'TIMESTAMP WITH TIME ZONE', defaultValueComputed: NOW(), constraints: {nullable: false}}
        - addUniqueConstraint: {tableName: job_card, columnNames: 'company_id,job_no', constraintName: uk_job_card_company_no}
        - createIndex: {tableName: job_card, indexName: idx_job_card_karigar, columns: [{column: {name: karigar_id}}, {column: {name: status}}]}
  - changeSet:
