              - column: {name: purchase_no, type: VARCHAR(80), constraints: {nullable: false}}
              - column: {name: supplier_invoice_no, type: VARCHAR(80)}
              - column: {name: purchase_date, type: DATE, constraints: {nullable: false}}
              - column: {name: status, type: VARCHAR(30), defaultValue: RECEIVED, constraints: {nullable: false}}
              - column: {name: subtotal, type: 'DECIMAL(19,3)', defaultValueNumeric: 0, constraints: {nullable: false}}
