              - column: {name: movement_date, type: DATE, constraints: {nullable: false}}
              - column: {name: weight, type: 'DECIMAL(19,3)', constraints: {nullable: false}}
              - column: {name: fine_weight, type: 'DECIMAL(19,3)', constraints: {nullable: false}}
              - column: {name: notes, type: VARCHAR(500)}
              - column: {name: created_by_id, type: BIGINT, constraints: {foreignKeyName: fk_job_metal_movement_created_by, references: app_user(id)}}
