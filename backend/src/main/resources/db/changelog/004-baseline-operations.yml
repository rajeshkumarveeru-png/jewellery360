              - column: {name: returned_amount, type: 'DECIMAL(19,3)', defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: notes, type: VARCHAR(2000)}
              - column: {name: created_by_id, type: BIGINT, constraints: {foreignKeyName: fk_purchase_order_created_by, references: app_user(id)}}
              - column: {name: created_at, type: 'TIMESTAMP WITH TIME ZONE', defaultValueComputed: NOW(), constraints: {nullable: false}}
        - addUniqueConstraint: {tableName: purchase_order, columnNames: 'company_id,purchase_no', constraintName: uk_purchase_company_no}
        - createIndex: {tableName: purchase_order, indexName: idx_purchase_supplier, columns: [{column: {name: supplier_id}}]}
