databaseChangeLog:
  # One "please pay ₹x by UPI" request for a bill: the shop's own UPI QR (confirmed by the cashier)
  # or a Razorpay QR / payment link (confirmed by Razorpay).
  - changeSet:
      id: 005-upi-payment-request
      author: jewellery360
      changes:
        - createTable:
            tableName: upi_payment_request
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: company_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_upi_request_company, references: company(id)}}
              - column: {name: branch_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_upi_request_branch, references: branch(id)}}
              - column: {name: sale_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_upi_request_sale, references: sale(id)}}
              - column: {name: mode, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: amount, type: 'DECIMAL(19,3)', constraints: {nullable: false}}
              - column: {name: status, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: upi_uri, type: VARCHAR(600)}
              - column: {name: provider_ref, type: VARCHAR(80)}
              - column: {name: qr_image_url, type: VARCHAR(600)}
              - column: {name: short_url, type: VARCHAR(300)}
              - column: {name: provider_payment_id, type: VARCHAR(80)}
              - column: {name: utr, type: VARCHAR(40)}
              - column: {name: payer_vpa, type: VARCHAR(120)}
              - column: {name: paid_amount, type: 'DECIMAL(19,3)'}
              - column: {name: payment_id, type: BIGINT, constraints: {foreignKeyName: fk_upi_request_payment, references: payment(id)}}
              - column: {name: note, type: VARCHAR(500)}
              - column: {name: expires_at, type: 'TIMESTAMP WITH TIME ZONE'}
              - column: {name: paid_at, type: 'TIMESTAMP WITH TIME ZONE'}
              - column: {name: created_by_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_upi_request_created_by, references: app_user(id)}}
              - column: {name: created_at, type: 'TIMESTAMP WITH TIME ZONE', defaultValueComputed: NOW(), constraints: {nullable: false}}
        - createIndex: {tableName: upi_payment_request, indexName: idx_upi_request_provider_ref, columns: [{column: {name: provider_ref}}]}
        - createIndex: {tableName: upi_payment_request, indexName: idx_upi_request_sale, columns: [{column: {name: sale_id}}]}
