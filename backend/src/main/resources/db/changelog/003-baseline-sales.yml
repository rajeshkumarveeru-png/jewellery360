              - column: {name: description, type: VARCHAR(2000), constraints: {nullable: false}}
              - column: {name: purity_id, type: BIGINT, constraints: {foreignKeyName: fk_custom_order_purity, references: purity_master(id)}}
              - column: {name: target_weight, type: 'DECIMAL(19,3)', defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: making_notes, type: VARCHAR(300)}
              - column: {name: locked_rate, type: 'DECIMAL(19,3)', defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: estimate, type: 'DECIMAL(19,3)', defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: status, type: VARCHAR(30), defaultValue: ORDERED, constraints: {nullable: false}}
              - column: {name: karigar_id, type: BIGINT, constraints: {foreignKeyName: fk_custom_order_karigar, references: karigar(id)}}
              - column: {name: notes, type: VARCHAR(1000)}
