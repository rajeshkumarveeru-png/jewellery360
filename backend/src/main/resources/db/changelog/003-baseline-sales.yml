databaseChangeLog:
  # Tables marked with the legacy guard already exist in development databases created before the
  # pre-production schema consolidation; 090-legacy-dev-upgrade.yml converts those. Remove the guards
  # together with 090-legacy-dev-upgrade.yml once every development database has been upgraded.
  - changeSet:
      id: baseline-customer
      author: jewellery360
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sqlCheck: {expectedResult: '1', sql: "SELECT COUNT(*) FROM databasechangelog WHERE id = '001-core'"}
      changes:
        - createTable:
            tableName: customer
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: company_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_customer_company, references: company(id)}}
              - column: {name: branch_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_customer_branch, references: branch(id)}}
              - column: {name: name, type: VARCHAR(180), constraints: {nullable: false}}
              - column: {name: phone, type: VARCHAR(25)}
              - column: {name: email, type: VARCHAR(180)}
              - column: {name: address, type: VARCHAR(600)}
              - column: {name: gstin, type: VARCHAR(30)}
              - column: {name: pan, type: VARCHAR(20)}
              - column: {name: birthday, type: DATE}
              - column: {name: anniversary, type: DATE}
              - column: {name: notes, type: VARCHAR(2000)}
              - column: {name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: created_at, type: 'TIMESTAMP WITH TIME ZONE', defaultValueComputed: NOW(), constraints: {nullable: false}}
        - createIndex: {tableName: customer, indexName: idx_customer_company_phone, columns: [{column: {name: company_id}}, {column: {name: phone}}]}
        - createIndex: {tableName: customer, indexName: idx_customer_company_name, columns: [{column: {name: company_id}}, {column: {name: name}}]}
