              - column: {name: company_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_supplier_company, references: company(id)}}
              - column: {name: name, type: VARCHAR(180), constraints: {nullable: false}}
              - column: {name: phone, type: VARCHAR(25)}
              - column: {name: email, type: VARCHAR(180)}
              - column: {name: address, type: VARCHAR(600)}
              - column: {name: gstin, type: VARCHAR(30)}
              - column: {name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: created_at, type: 'TIMESTAMP WITH TIME ZONE', defaultValueComputed: NOW(), constraints: {nullable: false}}
        - addUniqueConstraint: {tableName: supplier, columnNames: 'company_id,name', constraintName: uk_supplier_company_name}
  - changeSet:
      id: baseline-karigar
      author: jewellery360
      changes:
        - createTable:
            tableName: karigar
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: company_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_karigar_company, references: company(id)}}
              - column: {name: name, type: VARCHAR(150), constraints: {nullable: false}}
              - column: {name: phone, type: VARCHAR(25)}
              - column: {name: address, type: VARCHAR(500)}
              - column: {name: notes, type: VARCHAR(1000)}
              - column: {name: active, type: BOOLEAN, defaultValueBoolean: true, constraints: {nullable: false}}
              - column: {name: created_at, type: 'TIMESTAMP WITH TIME ZONE', defaultValueComputed: NOW(), constraints: {nullable: false}}
        - addUniqueConstraint: {tableName: karigar, columnNames: 'company_id,name', constraintName: uk_karigar_company_name}
  - changeSet:
      id: baseline-jewellery-item
      author: jewellery360
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sqlCheck: {expectedResult: '1', sql: "SELECT COUNT(*) FROM databasechangelog WHERE id = '001-core'"}
      changes:
        - createTable:
            tableName: jewellery_item
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: version, type: BIGINT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: company_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_jewellery_item_company, references: company(id)}}
              - column: {name: branch_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_jewellery_item_branch, references: branch(id)}}
              - column: {name: product_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_jewellery_item_product, references: jewellery_product(id)}}
              - column: {name: purity_id, type: BIGINT, constraints: {nullable: false, foreignKeyName: fk_jewellery_item_purity, references: purity_master(id)}}
              - column: {name: tag_no, type: VARCHAR(80), constraints: {nullable: false}}
              - column: {name: barcode, type: VARCHAR(100), constraints: {nullable: false}}
              - column: {name: huid, type: VARCHAR(20)}
              - column: {name: certificate_no, type: VARCHAR(80)}
              - column: {name: gross_weight, type: 'DECIMAL(19,3)', constraints: {nullable: false}}
              - column: {name: stone_weight, type: 'DECIMAL(19,3)', defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: net_weight, type: 'DECIMAL(19,3)', constraints: {nullable: false}}
              - column: {name: stone_count, type: INT, defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: stone_details, type: VARCHAR(500)}
              - column: {name: stone_value, type: 'DECIMAL(19,3)', defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: wastage_percent, type: 'DECIMAL(19,3)', defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: making_type, type: VARCHAR(20), defaultValue: FIXED, constraints: {nullable: false}}
              - column: {name: making_value, type: 'DECIMAL(19,3)', defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: other_charge, type: 'DECIMAL(19,3)', defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: cost_price, type: 'DECIMAL(19,3)', defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: mrp, type: 'DECIMAL(19,3)', defaultValueNumeric: 0, constraints: {nullable: false}}
              - column: {name: location, type: VARCHAR(120)}
              - column: {name: status, type: VARCHAR(30), defaultValue: IN_STOCK, constraints: {nullable: false}}
              - column: {name: source, type: VARCHAR(30), defaultValue: OPENING, constraints: {nullable: false}}
              - column: {name: notes, type: VARCHAR(1000)}
              - column: {name: created_at, type: 'TIMESTAMP WITH TIME ZONE', defaultValueComputed: NOW(), constraints: {nullable: false}}
              - column: {name: updated_at, type: 'TIMESTAMP WITH TIME ZONE', defaultValueComputed: NOW(), constraints: {nullable: false}}
              - column: {name: sold_at, type: 'TIMESTAMP WITH TIME ZONE'}
        - addUniqueConstraint: {tableName: jewellery_item, columnNames: 'company_id,tag_no', constraintName: uk_item_company_tag}
        - addUniqueConstraint: {tableName: jewellery_item, columnNames: 'company_id,barcode', constraintName: uk_item_company_barcode}
        - createIndex: {tableName: jewellery_item, indexName: idx_item_company_branch_status, columns: [{column: {name: company_id}}, {column: {name: branch_id}}, {column: {name: status}}]}
        - createIndex: {tableName: jewellery_item, indexName: idx_item_company_huid, columns: [{column: {name: company_id}}, {column: {name: huid}}]}
