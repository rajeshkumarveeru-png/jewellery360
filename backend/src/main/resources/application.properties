spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yml
server.port=${PORT:8080}
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
logging.level.com.jewellery360=INFO
logging.level.org.springframework.security=WARN

server.error.include-message=always

# Backups (pg_dump / pg_restore must be installed on the server)
app.backup.dir=${BACKUP_DIR:./backups}
app.backup.keep=${BACKUP_KEEP:14}
app.backup.schedule-enabled=${BACKUP_SCHEDULE_ENABLED:true}
app.backup.cron=${BACKUP_CRON:0 30 1 * * *}
app.backup.pg-dump=${PG_DUMP:pg_dump}
app.backup.pg-restore=${PG_RESTORE:pg_restore}
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB

# First start only: password of the platform administrator "admin" (random one-time password in the log when empty)
app.bootstrap.admin-password=${APP_BOOTSTRAP_ADMIN_PASSWORD:admin123}
