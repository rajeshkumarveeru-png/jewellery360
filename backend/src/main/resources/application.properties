spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jewellery360}
spring.datasource.username=${DB_USERNAME:jewellery360}
spring.datasource.password=${DB_PASSWORD:jewellery360}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yml
server.port=${PORT:8080}
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
logging.level.com.jewellery360=INFO
logging.level.org.springframework.security=WARN

server.error.include-message=always
